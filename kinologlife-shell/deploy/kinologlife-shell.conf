# Публичная оболочка kinologlife.online. WordPress остаётся обработчиком всего остального,
# включая /wp-admin/admin-post.php (Robokassa) и /join/ при возврате с оплаты.

location = /shell-health {
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location /shell-assets/ {
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# Главная — оболочка. Служебные query WordPress (SSO в кабинет, подтверждение почты) остаются на WP.
location = / {
    error_page 418 = @kl_wp_root;
    if ($arg_kl_baza_sso != "") { return 418; }
    if ($arg_kl_confirm != "") { return 418; }
    if ($arg_kl_code != "") { return 418; }
    if ($arg_kl_email_confirm_error != "") { return 418; }
    if ($arg_kl_email_confirmed != "") { return 418; }
    if ($arg_kl_email_confirm_locked != "") { return 418; }
    if ($arg_preview != "") { return 418; }
    if ($arg_p != "") { return 418; }
    if ($arg_page_id != "") { return 418; }
    if ($arg_rest_route != "") { return 418; }

    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location @kl_wp_root {
    proxy_pass http://127.0.0.1:8088$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location = /kak-ustroeno {
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location = /kak-ustroeno/ {
    return 301 /kak-ustroeno$is_args$args;
}

